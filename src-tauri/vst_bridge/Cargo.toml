[package]
name = "vst_bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] } # For serializing Vst3PluginInfo to send to JS

[target.'cfg(windows)'.dependencies]
coinit = "0.5" # For COM initialization (CoInitializeEx/CoUninitialize RAII guard)

[build-dependencies]
cxx-build = "1.0"
